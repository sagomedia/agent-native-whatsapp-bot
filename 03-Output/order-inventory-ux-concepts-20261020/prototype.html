<script>
const $=id=>document.getElementById(id),money=n=>new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR',maximumFractionDigits:0}).format(n),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let mode='sheet',view='orders',stage='quote',stockMode='restock',stockSku='pipe',stockInput='6',stockQuery='',stockError='',packed=false,stockPickerOpen=false,history=[],toastTimer;
const baseLines=[{id:'pipe',name:'PVC Pipe 1 inch',qty:2,unit:'pieces',price:245,image:'H01',stock:'pipe'},{id:'switch',name:'switch',qty:2,unit:'pieces',price:null,needsProduct:true,source:'switch'},{id:'tape',name:'PTFE tape',qty:2,unit:'rolls',price:35,image:'H08',stock:'tape'},{id:'clamp',name:'Pipe clamp',qty:4,unit:'pieces',price:12,image:'H12',stock:'clamp'},{id:'mseal',name:'M-Seal 90g',qty:1,unit:'pack',price:45,image:'H21',stock:'mseal'},{id:'cutter',name:'PVC pipe cutter',qty:1,unit:'piece',price:null,image:'H19',stock:'cutter'},{id:'measure',name:'Measuring tape 5m',qty:1,unit:'piece',price:95,image:'H20'},{id:'gloves',name:'Safety gloves',qty:1,unit:'pair',price:60,image:'H29',stock:'gloves'}];
const baseStock=[{id:'pipe',name:'PVC Pipe 1 inch',unit:'pieces',onHand:12,held:3,image:'H01'},{id:'tape',name:'PTFE tape',unit:'rolls',onHand:24,held:4,image:'H08'},{id:'clamp',name:'Pipe clamp',unit:'pieces',onHand:36,held:8,image:'H12'},{id:'mseal',name:'M-Seal 90g',unit:'packs',onHand:8,held:2,image:'H21'},{id:'cutter',name:'PVC pipe cutter',unit:'pieces',onHand:4,held:1,image:'H19'},{id:'gloves',name:'Safety gloves',unit:'pairs',onHand:null,held:0,image:'H29'}];
let lines=structuredClone(baseLines),stock=structuredClone(baseStock),draft=null;
const unresolved=()=>lines.filter(l=>l.needsProduct||l.price===null||!Number.isFinite(l.price)||l.price<0||!Number.isInteger(l.qty)||l.qty<=0),subtotal=()=>lines.reduce((s,l)=>s+(!l.needsProduct&&l.price!==null&&l.price>=0&&l.qty>0?l.price*l.qty:0),0),photo=l=>l.image?'<img class="photo" src="assets/'+l.image+'.jpg" alt="" width="40" height="40">':'<span class="photo placeholder" aria-hidden="true">□</span>',product=l=>'<div class="product">'+photo(l)+'<div><strong>'+esc(l.name)+'</strong>'+(l.source?'<small>Customer asked: '+esc(l.source)+'</small>':'')+'</div></div>';
function toast(message){$('toast').textContent=message;$('toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').hidden=true,6000)}
function status(){return{quote:'Needs quote',sent:'Waiting for customer',accepted:'Check shelf stock',packing:'Preparing pickup',ready:'Ready for pickup',collected:'Collected'}[stage]}
function action(){const n=unresolved().length;if(stage==='quote')return n?'Resolve '+n+' '+(n===1?'item':'items'):'Send quote · '+money(subtotal());return{sent:'Waiting for customer',accepted:'Accept & reserve stock',packing:'Mark ready for pickup',ready:'Mark collected',collected:'Order completed'}[stage]}
function footer(){const n=unresolved().length;return '<div class="actionbar"><div><strong id="quote-total">'+(n?'Priced subtotal ':'Total ')+money(subtotal())+'</strong><small id="quote-note">'+(stage==='quote'?(n?n+' items not included':'Complete quote · customer approval required'):stage==='sent'?'Quote sent in this demo · awaiting customer approval':stage==='packing'?'Held for this order · collection deducts stock':stage==='collected'?'Collection recorded in this demo':'Payment is handled separately')+'</small></div><div class="actions">'+(stage==='quote'?'<button class="save" id="save-draft">Save draft</button>':'')+'<button class="primary" id="main-action" '+(['sent','collected'].includes(stage)?'disabled':'')+'>'+esc(action())+'</button></div></div>'}
function rows(){return lines.map((l,i)=>'<tr class="'+(l.needsProduct||l.price===null?'need':'')+'" id="row-'+l.id+'"><td>'+product(l)+(l.needsProduct&&stage==='quote'?'<button class="item-action" data-match="'+l.id+'">Choose product</button>':'')+'</td><td><label><span class="small-label">Quantity</span><div class="qty">'+(stage==='quote'?'<input aria-label="Quantity for '+esc(l.name)+'" data-field="qty-'+l.id+'" data-qty="'+l.id+'" type="number" min="1" max="100" step="1" value="'+l.qty+'">':'<strong>'+l.qty+'</strong>')+'<span>'+esc(l.unit)+'</span></div></label></td><td>'+(l.needsProduct?'<span class="muted">Choose product first</span>':stage==='quote'?'<label><span class="small-label">Price per '+esc(l.unit)+'</span><div class="price '+(l.price===null?'missing':'')+'"><input aria-label="Price for '+esc(l.name)+'" data-field="price-'+l.id+'" data-price="'+l.id+'" type="number" min="0" max="1000000" step="0.01" placeholder="Enter price" value="'+(l.price??'')+'"></div></label>':'<span class="money">'+money(l.price)+'</span>')+'</td><td class="money">'+(!l.needsProduct&&l.price!==null?money(l.price*l.qty):'—')+'</td></tr>').join('')}
function table(){return '<table class="lines"><thead><tr><th>Item</th><th>Quantity</th><th>Price / unit</th><th>Amount</th></tr></thead><tbody>'+rows()+'</tbody></table>'}
function packing(){return '<div class="packing"><h3>'+({accepted:'Check these items on the shelf',packing:'Pack the approved items',ready:'Ready to hand over',collected:'Collected items'}[stage])+'</h3>'+lines.map(l=>'<div class="pick-row">'+product(l)+'<strong>'+l.qty+' '+esc(l.unit)+'</strong></div>').join('')+(stage==='packing'?'<label class="packing-note"><input id="packed-confirm" type="checkbox" '+(packed?'checked':'')+'>I packed and checked all quantities, sizes and units.</label>':'')+'<p class="help-text">'+(stage==='accepted'?'Accepting reserves available stock after your shelf check.':'Only collection deducts the held stock. Payment is recorded separately.')+'</p></div>'}
function sheet(){const n=unresolved().length;return '<div class="workbench"><aside class="queue" aria-label="Demo order queue"><label>Find an order<input type="search" placeholder="Order or customer…" id="queue-search"></label><div class="queue-scroll" role="region" aria-label="Order list" tabindex="0"><article class="selected"><strong>#8C1CE</strong><p>Customer 2bf1c784</p><span class="badge">'+status()+'</span><small>8 items</small></article><article><strong>#7A9D1</strong><p>Demo order · waiting for customer</p><span class="badge calm">Quoted</span></article><article><strong>#6F2B7</strong><p>Demo order · collected</p><span class="badge calm">Completed</span></article><p class="help-text" style="padding:12px">This prototype opens one sample order.</p></div></aside><article class="sheet"><header class="sheet-head"><div><h2>Order #8C1CE <span class="badge">'+status()+'</span></h2><p>Customer 2bf1c784 · 8 requested items</p></div><button class="link" id="open-original">Original message</button></header><div class="banner '+(!n&&stage!=='sent'?'ok':'')+'" id="order-banner">'+(stage==='quote'?(n?n+' items need your help':'All items have a product, quantity and price.'):stage==='sent'?'Waiting for the customer to approve this quote. Use the demo control above to continue.':stage==='accepted'?'Customer approved. Check the shelf before accepting.':stage==='packing'?'Stock is held. Pack the approved items.':stage==='ready'?'Packed items are ready. Record collection after handing them over.':'This demo order is complete.')+'</div>'+'<div class="order-scroll" role="region" aria-label="Order items" tabindex="0">'+(['quote','sent'].includes(stage)?table():packing())+'<details class="order-details" id="original-details"><summary>Original customer request & order details</summary><p>2 PVC pipes, 2 switches, 2 PTFE tapes, 4 pipe clamps, 1 M-Seal, 1 pipe cutter, 1 measuring tape, 1 pair gloves.</p><p>Sample data only. Product substitution and price changes require customer approval. Payment and pickup stay separate.</p></details></div>'+footer()+'</article></div>'}
function choices(){return [['Anchor Roma 6A 1 Way',35],['Anchor Roma 16A 1 Way',65],['Anchor Penta 6A 1 Way',28]].map(([name,p],i)=>'<button class="choice" data-choose="'+i+'"><span><strong>'+name+'</strong><small>'+money(p)+' per piece · demo catalog</small></span><span class="use">Use this switch</span></button>').join('')}
function guide(){if(stage!=='quote'||!unresolved().length)return sheet();const l=unresolved()[0];return '<div class="guide-layout"><section class="guide"><div class="source">Customer asked: <strong>'+l.qty+' '+esc(l.source??l.name)+'</strong></div><h2>'+(l.needsProduct?'Which switch did the customer mean?':'What is the price for this '+esc(l.name)+'?')+'</h2>'+(l.needsProduct?'<label>Find the right product<input type="search" placeholder="Name, Tamil name or SKU…" id="guide-search"></label><div id="guide-choices">'+choices()+'</div><button class="link" id="manual-guide">Item is not in the catalog</button><p class="help-text">Next: enter the pipe cutter price.</p>':'<label>Price per '+esc(l.unit)+'<div class="price missing"><input id="guided-price" type="number" min="0" step="0.01" inputmode="decimal" placeholder="Enter price" aria-label="Guided cutter price"></div></label><button class="primary" id="finish-guided-price">Use this price</button><p class="help-text">The complete quote is shown before you send it.</p>')+'</section><aside class="order-so-far"><h3>Order so far</h3>'+lines.map(x=>'<div class="'+(x.needsProduct||x.price===null?'pending':'')+'"><span>'+esc(x.name)+(x.needsProduct?' · needs choice':x.price===null?' · needs price':'')+'</span><strong>×'+x.qty+'</strong></div>').join('')+'<div><span>Priced subtotal</span><strong>'+money(subtotal())+'</strong></div><p class="help-text">'+unresolved().length+' items not included</p></aside></div>'}
function stockPreview(){const p=stock.find(p=>p.id===stockSku),q=Number(stockInput),valid=stockInput.trim()!==''&&Number.isInteger(q)&&q>=(stockMode==='count'?0:1);let next=null,error='';if(!valid)error=stockMode==='count'?'Enter the actual number on the shelf, including held items.':'Enter a whole number greater than zero.';else if(p.onHand===null&&stockMode!=='count')error='The shelf count is unknown. Correct the count before adding or subtracting stock.';else{next=stockMode==='count'?q:stockMode==='restock'?p.onHand+q:p.onHand-q;if(next<p.held)error='This would leave fewer items than the '+p.held+' already held for orders.';}return{p,q,next,error}}
function stockDrawer(){const {p,q,next,error}=stockPreview(),verb={restock:'received',sale:'sold',count:'on shelf'}[stockMode],label={restock:'How many '+p.unit+' arrived?',sale:'How many '+p.unit+' were sold?',count:'How many '+p.unit+' are on the shelf?'}[stockMode];return '<section class="stock-card" id="stock-card" aria-label="Selected stock task">'+product(p)+'<button class="link" id="change-stock-product">Choose another product</button><p class="stock-note">Sold in '+esc(p.unit)+'. Held stock is controlled by orders.</p><div class="task-choices" aria-label="Stock tasks">'+[['restock','Receive stock'],['sale','Walk-in sale'],['count','Correct count']].map(([id,label])=>'<button data-task="'+id+'" aria-pressed="'+(stockMode===id)+'">'+label+'</button>').join('')+'</div><label>'+label+'<input type="number" data-field="stock-quantity" id="stock-quantity" value="'+esc(stockInput)+'" min="'+(stockMode==='count'?0:1)+'" step="1" aria-invalid="'+!!stockError+'"></label>'+(stockMode==='count'?'<p class="stock-note">Count all physical items, including '+p.held+' held for orders. Held quantities stay unchanged.</p>':'')+'<label class="optional">Receipt or note (optional)<input id="stock-note" placeholder="Supplier bill or a short note…"></label>'+(stockError?'<p class="error" role="alert">'+esc(stockError)+'</p>':'')+'<div class="stock-preview"><h3>After saving</h3>'+[['On shelf',p.onHand,next],['Held for orders',p.held,p.held],['Available',p.onHand===null?null:p.onHand-p.held,next===null?null:next-p.held]].map(([label,before,after])=>'<div class="preview-row"><span>'+label+'</span><span>'+ (before??'—')+'</span><span>→</span><strong>'+(error?'—':after??'—')+'</strong></div>').join('')+'</div><button class="primary" id="save-stock">'+(error?'Review quantity':'Save '+q+' '+verb)+'</button><p class="stock-note">Changes apply only to this prototype. Unknown stock is never treated as zero.</p></section>'}
function stockPage(){return '<div class="stock-layout" data-picker="'+stockPickerOpen+'"><section class="stock-list"><button class="link close-stock-picker" id="close-stock-picker">Back to selected product</button><label>Find a product<input id="stock-search" data-field="stock-search" type="search" placeholder="Search product, Tamil name or SKU…" value="'+esc(stockQuery)+'"></label><div class="stock-header"><span>Product</span><span>On shelf</span><span>Held for orders</span><span>Available</span></div><div class="stock-rows" role="region" aria-label="Stock products" tabindex="0">'+stock.filter(p=>p.name.toLowerCase().includes(stockQuery.toLowerCase())).map(p=>'<button class="stock-row" data-stock="'+p.id+'" aria-label="Select '+esc(p.name)+'" aria-pressed="'+(p.id===stockSku)+'">'+product(p)+'<span class="count">'+(p.onHand??'—')+'</span><span class="count">'+p.held+'</span><span class="count">'+(p.onHand===null?'—':p.onHand-p.held)+'</span></button>').join('')+'</div><p class="stock-note" style="padding:0 16px">On shelf includes held items. Available = on shelf − held for orders.</p></section><div class="stock-task-pane">'+stockDrawer()+(history.length?'<details class="stock-history" open><summary>Demo stock history</summary><ul>'+history.map(s=>'<li>'+esc(s)+'</li>').join('')+'</ul></details>':'')+'</div></div>'}
function render(){$('content').dataset.view=view;const active=document.activeElement?.dataset.field,selection=document.activeElement?.selectionStart;$('mode-sheet').setAttribute('aria-pressed',mode==='sheet');$('mode-guide').setAttribute('aria-pressed',mode==='guide');$('orders-nav').setAttribute('aria-current',view==='orders'?'page':'false');$('stock-nav').setAttribute('aria-current',view==='stock'?'page':'false');$('approve-demo').hidden=stage!=='sent';$('content').innerHTML='<header class="page-head"><div><h1>'+ (view==='stock'?'Stock':mode==='guide'?'Review the customer’s order':'Orders')+'</h1><p>'+(view==='stock'?'Find a product. Record what changed.':'A clear next action for each order.')+'</p></div><span class="badge calm">Sample data</span></header>'+(view==='orders'?'<div class="stage-filters"><span class="active">'+status()+'</span><span>Preparing</span><span>Ready</span><span>History</span></div>'+(mode==='guide'?guide():sheet()):stockPage());bind();if(active){const e=document.querySelector('[data-field="'+active+'"]');e?.focus({preventScroll:true});try{e?.setSelectionRange(selection,selection)}catch{}}}
function choose(i){const choices=[['Anchor Roma 6A 1 Way',35],['Anchor Roma 16A 1 Way',65],['Anchor Penta 6A 1 Way',28]],l=lines.find(l=>l.id==='switch');l.name=choices[i][0];l.price=choices[i][1];l.needsProduct=false;l.unit='pieces';if($('match-dialog').open)$('match-dialog').close();render();toast('Demo choice applied. Quantity kept at '+l.qty+' pieces.');if(mode==='guide')$('guided-price')?.focus()}
function openMatch(){$('match-dialog').innerHTML='<header><div><h2 id="match-title">Choose the customer’s switch</h2><p class="help-text">Requested: 2 switches. Choose deliberately; nothing is selected automatically.</p></div><button class="close" id="close-match" aria-label="Close product choices">×</button></header><label class="search">Search catalog<input id="match-search" type="search" placeholder="Name, Tamil name or SKU…"></label><div id="match-choices">'+choices()+'</div><details class="manual"><summary>Item is not in the catalog</summary><label>Item name<input id="manual-name" maxlength="200"></label><label>Price per piece (₹)<input id="manual-price" type="number" min="0" step="0.01"></label><button class="primary" id="use-manual">Use manual item</button></details>';$('match-dialog').showModal();$('close-match').onclick=()=>$('match-dialog').close();document.querySelectorAll('#match-dialog [data-choose]').forEach(b=>b.onclick=()=>choose(Number(b.dataset.choose)));$('match-search').oninput=e=>{const q=e.target.value.toLowerCase();document.querySelectorAll('#match-dialog [data-choose]').forEach(b=>b.hidden=!b.textContent.toLowerCase().includes(q))};$('use-manual').onclick=()=>{const name=$('manual-name').value.trim(),price=$('manual-price').value;if(!name||price===''||Number(price)<0){toast('Enter a name and a price for the manual item.');return}Object.assign(lines.find(l=>l.id==='switch'),{name,price:Number(price),needsProduct:false});$('match-dialog').close();render();toast('Manual item entered for this demo quote. Customer approval is still required.')};}
function mainAction(){if(stage==='quote'){const need=unresolved()[0];if(need){if(need.needsProduct){openMatch();return}const input=document.querySelector('[data-price="'+need.id+'"],[data-qty="'+need.id+'"]');input?.scrollIntoView({block:'center'});input?.focus();toast('Enter the missing price or quantity directly in this row.');return}stage='sent';toast('Demo only: the complete quote would now be sent. No WhatsApp message was sent.');render();return}if(stage==='accepted'){for(const l of lines){if(!l.stock)continue;const p=stock.find(p=>p.id===l.stock);if(p.onHand===null)continue;if(p.onHand-p.held<l.qty){toast(p.name+': available stock is short. Review the order with the customer.');return}}for(const l of lines)if(l.stock&&stock.find(p=>p.id===l.stock).onHand!==null)stock.find(p=>p.id===l.stock).held+=l.qty;stage='packing';toast('Demo order accepted. Tracked quantities are held; unknown stock stays unknown.');render();return}if(stage==='packing'){if(!packed){$('packed-confirm')?.scrollIntoView({block:'center'});$('packed-confirm')?.focus();toast('Check the packed quantities, sizes and units before marking ready.');return}stage='ready';render();toast('Demo pickup marked ready. Collection has not been recorded.');return}if(stage==='ready'){for(const l of lines)if(l.stock){const p=stock.find(p=>p.id===l.stock);if(p.onHand!==null){p.onHand-=l.qty;p.held-=l.qty}}stage='collected';render();toast('Demo collection recorded. Held items were deducted from on-shelf stock.')}}
function updateQuote(){const n=unresolved().length;if($('quote-total'))$('quote-total').textContent=(n?'Priced subtotal ':'Total ')+money(subtotal());if($('quote-note'))$('quote-note').textContent=n?n+' items not included':'Complete quote · customer approval required';if($('main-action'))$('main-action').textContent=action();if($('order-banner')){$('order-banner').textContent=n?n+' items need your help':'All items have a product, quantity and price.';$('order-banner').classList.toggle('ok',!n)}for(const l of lines){const row=$('row-'+l.id);if(!row)continue;row.classList.toggle('need',l.needsProduct||l.price===null);row.querySelector('td:last-child').textContent=!l.needsProduct&&l.price!==null?money(l.price*l.qty):'—'}}
function updateStockPreview(){const {p,q,next,error}=stockPreview();document.querySelector('.stock-card .error')?.remove();const values=[p.onHand,p.held,p.onHand===null?null:p.onHand-p.held],after=[next,p.held,next===null?null:next-p.held];document.querySelectorAll('.stock-preview .preview-row').forEach((row,i)=>{row.querySelector('strong').textContent=error?'—':after[i]??'—'});$('save-stock').textContent=error?'Review quantity':'Save '+q+' '+({restock:'received',sale:'sold',count:'on shelf'}[stockMode]);$('stock-quantity').setAttribute('aria-invalid','false')}
function bind(){if($('change-stock-product'))$('change-stock-product').onclick=()=>{if(innerWidth<=900){stockPickerOpen=true;render()}$('stock-search').focus({preventScroll:true})};if($('close-stock-picker'))$('close-stock-picker').onclick=()=>{stockPickerOpen=false;render();$('change-stock-product').focus()};document.querySelectorAll('[data-qty]').forEach(input=>input.oninput=()=>{lines.find(l=>l.id===input.dataset.qty).qty=Number(input.value);updateQuote()});document.querySelectorAll('[data-price]').forEach(input=>input.oninput=()=>{lines.find(l=>l.id===input.dataset.price).price=input.value===''?null:Number(input.value);updateQuote()});document.querySelectorAll('[data-match]').forEach(b=>b.onclick=openMatch);document.querySelectorAll('[data-choose]').forEach(b=>b.onclick=()=>choose(Number(b.dataset.choose)));if($('main-action'))$('main-action').onclick=mainAction;if($('save-draft'))$('save-draft').onclick=()=>{draft=structuredClone(lines);toast('Draft saved in this demo session only. The live shop was not changed.')};if($('open-original'))$('open-original').onclick=()=>{const d=$('original-details');d.open=!d.open;d.scrollIntoView({block:'center'})};if($('packed-confirm'))$('packed-confirm').onchange=e=>packed=e.target.checked;if($('guide-search'))$('guide-search').oninput=e=>{const q=e.target.value.toLowerCase();document.querySelectorAll('#guide-choices .choice').forEach(b=>b.hidden=!b.textContent.toLowerCase().includes(q))};if($('manual-guide'))$('manual-guide').onclick=openMatch;if($('finish-guided-price'))$('finish-guided-price').onclick=()=>{const p=$('guided-price').value;if(p===''||Number(p)<0){toast('Enter the price first.');$('guided-price').focus();return}unresolved()[0].price=Number(p);render()};if($('queue-search'))$('queue-search').oninput=e=>document.querySelectorAll('.queue article').forEach(a=>a.hidden=!a.textContent.toLowerCase().includes(e.target.value.toLowerCase()));document.querySelectorAll('[data-stock]').forEach(b=>b.onclick=()=>{stockSku=b.dataset.stock;stockPickerOpen=false;stockInput=stockMode==='restock'?'6':'';stockError='';render();if(innerWidth<650)$('stock-card').scrollIntoView({block:'start'})});document.querySelectorAll('[data-task]').forEach(b=>b.onclick=()=>{stockMode=b.dataset.task;stockInput=stockMode==='restock'?'6':'';stockError='';render();$('stock-quantity').focus()});if($('stock-quantity'))$('stock-quantity').oninput=e=>{stockInput=e.target.value;stockError='';updateStockPreview()};if($('stock-search'))$('stock-search').oninput=e=>{stockQuery=e.target.value;render()};if($('save-stock'))$('save-stock').onclick=()=>{const {p,q,next,error}=stockPreview();if(error){stockError=error;render();$('stock-quantity').focus();return}history.unshift(p.name+' · '+({restock:'Received ',sale:'Walk-in sale ',count:'Physical count '}[stockMode])+q+' '+p.unit+' · on shelf '+(p.onHand??'Unknown')+' → '+next+' · held '+p.held+' unchanged');p.onHand=next;stockError='';stockInput='';render();toast('Saved to this prototype only. The live inventory was not changed.')}}
$('orders-nav').onclick=()=>{view='orders';render();scrollTo(0,0)};$('stock-nav').onclick=()=>{view='stock';render();scrollTo(0,0)};$('mode-sheet').onclick=()=>{mode='sheet';view='orders';render()};$('mode-guide').onclick=()=>{mode='guide';view='orders';render()};$('approve-demo').onclick=()=>{if(stage==='sent'){stage='accepted';render();toast('Simulated customer approval. The owner must still check shelf stock.')}};$('reset-demo').onclick=()=>{lines=structuredClone(baseLines);stock=structuredClone(baseStock);stage='quote';stockMode='restock';stockSku='pipe';stockInput='6';stockQuery='';stockError='';packed=false;stockPickerOpen=false;history=[];draft=null;render();toast('Sample data reset.')} ;render();
</script></body></html>
