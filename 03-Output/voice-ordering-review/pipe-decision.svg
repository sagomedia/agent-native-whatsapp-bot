<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="555" viewBox="0 0 1200 555" role="img" aria-label="A shared word is not an exact product identity"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#4c7c84"/></marker></defs><rect width="100%" height="100%" fill="#fafbf9"/><text x="35" y="48" font-size="30" fill="#163047" font-family="sans-serif" font-weight="bold">A shared word is not an exact product identity</text><path d="M315 177L410 177" fill="none" stroke="#4c7c84" stroke-width="2.5" marker-end="url(#arrow)"/><text x="362.5" y="168.0" font-size="16" text-anchor="middle" font-family="sans-serif" fill="#567083">understand</text><path d="M765 177L870 177" fill="none" stroke="#4c7c84" stroke-width="2.5" marker-end="url(#arrow)"/><text x="817.5" y="168.0" font-size="16" text-anchor="middle" font-family="sans-serif" fill="#567083">search</text><path d="M1040 250L990 365" fill="none" stroke="#4c7c84" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M600 250L600 365" fill="none" stroke="#4c7c84" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M460 250L210 365" fill="none" stroke="#4c7c84" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="30" y="115" width="285" height="135" rx="5" fill="#edf5f1" stroke="#8dacac"/><text x="44" y="145" font-size="21" font-family="sans-serif" fill="#163047" font-weight="bold">Customer says: two pipes</text><text x="44" y="174" font-size="16" font-family="sans-serif" fill="#567083">Diameter: 1 inch</text><text x="44" y="197" font-size="16" font-family="sans-serif" fill="#567083">Type / brand / length: unknown</text><rect x="415" y="115" width="350" height="135" rx="5" fill="#edf5f1" stroke="#8dacac"/><text x="429" y="145" font-size="21" font-family="sans-serif" fill="#163047" font-weight="bold">Ask the missing identity</text><text x="429" y="174" font-size="16" font-family="sans-serif" fill="#567083">PVC? Flexible watering hose?</text><text x="429" y="197" font-size="16" font-family="sans-serif" fill="#567083">Pump delivery / suction pipe?</text><text x="429" y="220" font-size="16" font-family="sans-serif" fill="#567083">Keep count = 2 and diameter = 1 inch</text><rect x="875" y="105" width="285" height="145" rx="5" fill="#edf5f1" stroke="#8dacac"/><text x="889" y="135" font-size="21" font-family="sans-serif" fill="#163047" font-weight="bold">Catalog match?</text><text x="889" y="164" font-size="16" font-family="sans-serif" fill="#567083">Must support stated type / brand</text><text x="889" y="187" font-size="16" font-family="sans-serif" fill="#567083">Same size alone is insufficient</text><text x="889" y="210" font-size="16" font-family="sans-serif" fill="#567083">Missing item stays shop check</text><rect x="50" y="370" width="330" height="130" rx="5" fill="#edf5f1" stroke="#8dacac"/><text x="64" y="400" font-size="21" font-family="sans-serif" fill="#163047" font-weight="bold">Explicit PVC pipe</text><text x="64" y="429" font-size="16" font-family="sans-serif" fill="#567083">Show matching PVC variants</text><text x="64" y="452" font-size="16" font-family="sans-serif" fill="#567083">Customer chooses actual product</text><rect x="435" y="370" width="330" height="130" rx="5" fill="#edf5f1" stroke="#8dacac"/><text x="449" y="400" font-size="21" font-family="sans-serif" fill="#163047" font-weight="bold">Explicit watering hose</text><text x="449" y="429" font-size="16" font-family="sans-serif" fill="#567083">Show verified hose size / pack</text><text x="449" y="452" font-size="16" font-family="sans-serif" fill="#567083">Do not imply pump compatibility</text><rect x="825" y="370" width="330" height="130" rx="5" fill="#edf5f1" stroke="#8dacac"/><text x="839" y="400" font-size="21" font-family="sans-serif" fill="#163047" font-weight="bold">Pump pipe absent</text><text x="839" y="429" font-size="16" font-family="sans-serif" fill="#567083">Keep requested item and amount</text><text x="839" y="452" font-size="16" font-family="sans-serif" fill="#567083">Shop must confirm type / stock</text><text x="839" y="475" font-size="16" font-family="sans-serif" fill="#567083">No PVC or 10m hose substitution</text></svg>