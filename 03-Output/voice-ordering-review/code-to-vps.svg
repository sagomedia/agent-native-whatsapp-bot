<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-label="GitHub keeps code history. Deployment changes the running VPS."><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#4c7c84"/></marker></defs><rect width="100%" height="100%" fill="#fafbf9"/><text x="35" y="48" font-size="30" fill="#163047" font-family="sans-serif" font-weight="bold">GitHub keeps code history. Deployment changes the running VPS.</text><path d="M285 167L320 167" fill="none" stroke="#4c7c84" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M580 167L615 167" fill="none" stroke="#4c7c84" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M875 167L910 167" fill="none" stroke="#4c7c84" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M1040 230L160 360" fill="none" stroke="#4c7c84" stroke-width="2.5" marker-end="url(#arrow)"/><text x="600.0" y="286.0" font-size="16" text-anchor="middle" font-family="sans-serif" fill="#567083">approved source</text><path d="M285 430L320 430" fill="none" stroke="#4c7c84" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M580 430L615 430" fill="none" stroke="#4c7c84" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M875 430L910 430" fill="none" stroke="#4c7c84" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="30" y="105" width="255" height="125" rx="5" fill="#edf5f1" stroke="#8dacac"/><text x="44" y="135" font-size="21" font-family="sans-serif" fill="#163047" font-weight="bold">1  Fetch main</text><text x="44" y="164" font-size="16" font-family="sans-serif" fill="#567083">Update remote references</text><text x="44" y="187" font-size="16" font-family="sans-serif" fill="#567083">Keep dirty checkout untouched</text><rect x="325" y="105" width="255" height="125" rx="5" fill="#edf5f1" stroke="#8dacac"/><text x="339" y="135" font-size="21" font-family="sans-serif" fill="#163047" font-weight="bold">2  Feature worktree</text><text x="339" y="164" font-size="16" font-family="sans-serif" fill="#567083">Make changes on a branch</text><text x="339" y="187" font-size="16" font-family="sans-serif" fill="#567083">Commit + build + tests</text><rect x="620" y="105" width="255" height="125" rx="5" fill="#edf5f1" stroke="#8dacac"/><text x="634" y="135" font-size="21" font-family="sans-serif" fill="#163047" font-weight="bold">3  Push branch</text><text x="634" y="164" font-size="16" font-family="sans-serif" fill="#567083">Publish commits to GitHub</text><text x="634" y="187" font-size="16" font-family="sans-serif" fill="#567083">Does not change the VPS</text><rect x="915" y="105" width="255" height="125" rx="5" fill="#edf5f1" stroke="#8dacac"/><text x="929" y="135" font-size="21" font-family="sans-serif" fill="#163047" font-weight="bold">4  Pull request</text><text x="929" y="164" font-size="16" font-family="sans-serif" fill="#567083">Review diff + CI checks</text><text x="929" y="187" font-size="16" font-family="sans-serif" fill="#567083">Merge updates GitHub main</text><rect x="30" y="365" width="255" height="145" rx="5" fill="#edf5f1" stroke="#8dacac"/><text x="44" y="395" font-size="21" font-family="sans-serif" fill="#163047" font-weight="bold">5  Verified source</text><text x="44" y="424" font-size="16" font-family="sans-serif" fill="#567083">Choose exact reviewed commit</text><text x="44" y="447" font-size="16" font-family="sans-serif" fill="#567083">Local replay + test evidence</text><text x="44" y="470" font-size="16" font-family="sans-serif" fill="#567083">Secrets stay outside Git</text><rect x="325" y="365" width="255" height="145" rx="5" fill="#edf5f1" stroke="#8dacac"/><text x="339" y="395" font-size="21" font-family="sans-serif" fill="#163047" font-weight="bold">6  Immutable bundle</text><text x="339" y="424" font-size="16" font-family="sans-serif" fill="#567083">Build off-server</text><text x="339" y="447" font-size="16" font-family="sans-serif" fill="#567083">Manifest + archive checksum</text><text x="339" y="470" font-size="16" font-family="sans-serif" fill="#567083">Stage without activation</text><rect x="620" y="365" width="255" height="145" rx="5" fill="#edf5f1" stroke="#8dacac"/><text x="634" y="395" font-size="21" font-family="sans-serif" fill="#163047" font-weight="bold">7  Backup + activate</text><text x="634" y="424" font-size="16" font-family="sans-serif" fill="#567083">Save database + configuration</text><text x="634" y="447" font-size="16" font-family="sans-serif" fill="#567083">Switch current symlink</text><text x="634" y="470" font-size="16" font-family="sans-serif" fill="#567083">Restart systemd service</text><rect x="915" y="365" width="255" height="145" rx="5" fill="#edf5f1" stroke="#8dacac"/><text x="929" y="395" font-size="21" font-family="sans-serif" fill="#163047" font-weight="bold">8  Verify / recover</text><text x="929" y="424" font-size="16" font-family="sans-serif" fill="#567083">Readiness + URL checks</text><text x="929" y="447" font-size="16" font-family="sans-serif" fill="#567083">Confirm preserved records</text><text x="929" y="470" font-size="16" font-family="sans-serif" fill="#567083">Restore previous release if needed</text></svg>