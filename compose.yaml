name: shopbot-connected-local
services:
  postgres:
    image: postgres:18-bookworm@sha256:194e55feb2597b1465dbee81cc9fd8d204566cd2eb42c8d22fd6c931a38781b1
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-shopbot_local}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set the local PostgreSQL password in .env}
      POSTGRES_DB: shopbot_dev
    ports:
      - "127.0.0.1:${SHOPBOT_DB_PORT:-55441}:5432"
    volumes:
      - database:/var/lib/postgresql
      - ./deploy/local/init-test-database.sql:/docker-entrypoint-initdb.d/10-test-database.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  database:
