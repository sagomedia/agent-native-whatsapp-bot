# For the new, dedicated PostgreSQL installation on the 1 GB preview VM.
listen_addresses = '127.0.0.1'
max_connections = 32
shared_buffers = '32MB'
effective_cache_size = '128MB'
work_mem = '1MB'
maintenance_work_mem = '32MB'
max_parallel_workers_per_gather = 0
jit = off
temp_file_limit = '128MB'
max_wal_size = '256MB'
min_wal_size = '80MB'
