name: Project checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: project-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.6-bookworm
        env:
          POSTGRES_USER: shopbot
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: shopbot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shopbot -d shopbot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      APP_MODE: mock
      DATABASE_URL: postgres://shopbot:ci-test-only@127.0.0.1:5432/shopbot
      MEDIA_DIR: /tmp/shopbot-ci-media
      ALLOW_LOCAL_AI_TEST: 'false'
      ALLOW_FREE_INFERENCE: 'false'
      ALLOW_PAID_INFERENCE: 'false'
    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install audio tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install locked dependencies
        run: npm ci
      - name: Typecheck and build
        run: |
          if [[ "$GITHUB_REF" == refs/heads/main ]]; then
            npm run release:manifest
          else
            npm run build
          fi
      - name: Run PostgreSQL integration tests
        # Avoid CPU oversubscription in the 100-image fixture; keep every assertion and timeout.
        run: npx tsx --test --test-concurrency=2 tests/*.test.ts
      - name: Validate catalog preparation
        run: python3 -m unittest discover -s scripts -p 'test_catalog_cleanup.py'
      - name: Validate native deployment helpers
        run: python3 -m unittest discover -s deploy/native -p 'test_*.py'
      - name: Exercise the built dashboard in Chromium
        run: |
          browser_tools="$RUNNER_TEMP/shopbot-browser"
          npm install --prefix "$browser_tools" --no-save playwright@1.62.1
          node "$browser_tools/node_modules/playwright/cli.js" install chromium
          export PLAYWRIGHT_MODULE="$browser_tools/node_modules/playwright/index.mjs"
          export CHROME_BIN="$(node --input-type=module -e 'console.log((await import(process.env.PLAYWRIGHT_MODULE)).chromium.executablePath())')"
          node scripts/check-dashboard-feedback.mjs
      - name: Package the tested release
        if: github.ref == 'refs/heads/main'
        env:
          NODE_RELEASE: v22.23.4
        run: |
          core_runtime="$RUNNER_TEMP/node-runtime"
          mkdir -p "$core_runtime"
          curl -fsS --retry 3 "https://nodejs.org/dist/$NODE_RELEASE/node-$NODE_RELEASE-linux-x64.tar.xz" -o "$core_runtime/node-$NODE_RELEASE-linux-x64.tar.xz"
          curl -fsS --retry 3 "https://nodejs.org/dist/$NODE_RELEASE/SHASUMS256.txt" -o "$core_runtime/SHASUMS256.txt"
          python3 deploy/native/package-release.py \
            --node-archive "$core_runtime/node-$NODE_RELEASE-linux-x64.tar.xz" \
            --node-shasums "$core_runtime/SHASUMS256.txt" \
            --output-dir "$RUNNER_TEMP/shopbot-release"
      - name: Save the release package
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: shopbot-vps-${{ github.sha }}
          path: ${{ runner.temp }}/shopbot-release/shopbot-vps-preview-*.tar.gz*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  stage:
    name: Stage the VPS release
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: vps
    concurrency:
      group: shopbot-vps
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Fetch the exact tested package
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "shopbot-vps-$GITHUB_SHA" --dir "$RUNNER_TEMP/shopbot-release"
      - name: Stage and verify on the VPS
        env:
          VPS_RELEASE_HOST: ${{ vars.VPS_RELEASE_HOST }}
          VPS_RELEASE_KNOWN_HOST: ${{ vars.VPS_RELEASE_KNOWN_HOST }}
          VPS_RELEASE_KEY: ${{ secrets.VPS_RELEASE_KEY }}
        run: bash deploy/native/send-github-release.sh stage "$RUNNER_TEMP/shopbot-release"
